# RedisShoes — Marco 2: Redis (master + réplica) + MongoDB + Cassandra + API
services:
  redis-master:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]

  redis-replica:
    image: redis:7
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--replica-read-only", "yes"]
    depends_on: [redis-master]
    ports: ["6380:6379"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes: ["cassandra-data:/var/lib/cassandra"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis-master:6379/0
      REDIS_REPLICA_URL: redis://redis-replica:6379/0
      MONGO_URL: mongodb://mongo:27017
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_RF: "1"          # 1 nó no laboratório; em produção, 3
      SEED_ON_START: "1"
    depends_on:
      - redis-master
      - redis-replica
      - mongo
      - cassandra

volumes:
  mongo-data:
  cassandra-data:
